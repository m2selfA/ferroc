[package]
name = "ferroc"
version = "0.1.0"
edition = "2024"
description = "Ferrum + Commander: native Rust remote computer tools"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "form"] }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
scrypt = "0.11"
sha2 = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
tempfile = "3"
humantime = "2"
# Feature unification deliberately wipes AES key schedules used by aes-gcm.
aes = { version = "0.8", features = ["zeroize"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
strip = true
